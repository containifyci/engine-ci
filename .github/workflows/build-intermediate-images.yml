name: Build Intermediate Images

on:
  push:
    branches: [main]
    paths:
      - 'pkg/**/Dockerfile*'
      - 'pkg/**/docker_metadata_gen.go'
      - 'cmd/images.go'
      - '.github/workflows/build-intermediate-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BUILD_TAGS: containers_image_openpgp,exclude_graphdriver_btrfs

jobs:
  list-images:
    name: List intermediate images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      count: ${{ steps.images.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate image list
        id: images
        run: |
          set -euo pipefail
          # `engine-ci images` outputs a JSON array of ImageInfo objects.
          IMAGES_JSON="$(go run --tags "${BUILD_TAGS}" . images)"
          echo "Raw image list:" >&2
          echo "$IMAGES_JSON" >&2

          # Build the GitHub Actions matrix. Each matrix entry carries the
          # fields needed by the build job below.
          MATRIX="$(printf '%s' "$IMAGES_JSON" | jq -c '{include: [.[] | {name: .name, uri: .uri, dockerfile: .dockerfile, context: .context, build_step: .build_step}]}')"
          COUNT="$(printf '%s' "$IMAGES_JSON" | jq 'length')"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Generated matrix with $COUNT images" >&2

  build:
    name: Build ${{ matrix.name }}
    needs: list-images
    if: needs.list-images.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.list-images.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: containifyci
          password: ${{ secrets.CONTAINIFYCI_DOCKER_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.uri }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          echo "### Built intermediate image: \`${{ matrix.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ matrix.uri }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dockerfile | \`${{ matrix.dockerfile }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build step | \`${{ matrix.build_step }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64 |" >> "$GITHUB_STEP_SUMMARY"